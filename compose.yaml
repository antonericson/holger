x-holger: &holger
  image: ghcr.io/antonericson/holger:latest
  build: .
  env_file: .env
  environment:
    DATA_DIR: /data
  restart: unless-stopped
  volumes:
    - ${APPDATA_DIR:-./data}:/data

services:
  collector:
    <<: *holger
    command: python -m holger.collector
    healthcheck:
      test: ["CMD", "python", "-m", "holger.healthcheck"]
      interval: 1m
      timeout: 10s
      start_period: 2m
      retries: 3

  reporter:
    <<: *holger
    command: supercronic /app/crontab
