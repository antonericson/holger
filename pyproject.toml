[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]

[tool.pyright]
include = ["holger", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
